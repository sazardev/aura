<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#58cc02" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>Aura — Learn English at full power</title>
    <meta
      name="description"
      content="Learn English at full power with Aura — a Duolingo-style course that is 100% local, free and open source: WordNet dictionary, text analyzer, spaced repetition and offline pronunciation."
    />
    <meta
      name="keywords"
      content="learn english, english course, duolingo, spaced repetition, wordnet, offline, open source, tauri, vocabulary"
    />
    <meta name="author" content="Aura contributors" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aura" />
    <meta property="og:title" content="Aura — Learn English at full power" />
    <meta
      property="og:description"
      content="A Duolingo-style English course that is 100% local, free and open source: WordNet dictionary, text analyzer, spaced repetition and offline pronunciation."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aura — Learn English at full power" />
    <meta
      name="twitter:description"
      content="A Duolingo-style English course that is 100% local, free and open source."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Icons & manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Structured data -->
    <script type="application/ld+json" src="/structured-data.json"></script>

    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ipc: http://ipc.localhost; img-src 'self' data:; media-src 'self' data: blob:; font-src 'self' data:;"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
